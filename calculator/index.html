<!DOCTYPE html>

<html>
<body>
<head>
    <title>matrix calculator</title>
    <link rel="stylesheet" href="../build/style.css" />
    <link rel="icon" type="image/x-icon" href="../build/favicon.ico">
    <link rel="preload" href="https://fonts.googleapis.com" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com" rel="stylesheet"></noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

</head>
    <script>
        var exports = {};
    </script>
    <div class="navBar">
        <nav><a href="/" class="navText">Ducky</a></nav>
        <nav style="margin-left: auto; display: flex; margin-right: 1vw;"><h2><a href="..">generator</a></h2></nav>
        <nav style="display: flex; margin-right: 1vw;"><h2><a href="../game">exercise</a></h2></nav>
        <nav style="display: flex; margin-right: 1vw;"><h2>calculator</h2></nav>
        <nav style="display: flex; margin-right: 1vw;"><h2><a href="../systems">systems</a></h2></nav>
        <nav style="display: flex; margin-right: 4vw;"><h2><a href="../vectors">vectors</a></h2></nav>
    </div>
    
    <section class="wrapper">
        <div class="bg-fixed" aria-hidden="true"></div>
        <form style="width: 100vw;" class="matrix-form">
            <h2>Matrix operation calculator</h2><br>
            <a class="codebadges" href="https://github.com/ducky4life/matrix"><img src="https://img.shields.io/badge/Source Code-181717?logo=github&logoColor=fff&style=for-the-badge" alt="GitHub Badge"></a>
            <p style="padding-top: 10px;">minors/cofactors: input row/column, eigenvalue/vector/basis: 2x2 only</p>
            <p style="padding-top: 10px;">idk why safari transform is so blurry, use desktop chrome</p>
            <br>

            <div style="padding-bottom: 30px;">
                <select id="dimension" class="button">
                    <option value="2">2x2</option>
                    <option value="3">3x3</option>
                </select>
            </div><br>
            
            <div style="display: flex; justify-content: center; align-items: stretch; place-self: center; max-width: 95vw;" class="calculator-input-box">

            <div class="matrix-input-box">
                <div class="matrix-container" id="m1_box" style="margin-bottom: 3vh;">
                </div>

                <div style="display: flex;" class="reset-font-size">
                    <select id="m1_property" class="button unblur">
                        <option value="3">det</option>
                        <option value="4">inverse</option>
                        <option value="5">transpose</option>
                        <option value="6">adjoint</option>
                        <option value="7">minor</option>
                        <option value="8">cofactor</option>
                        <option value="9">raise power</option>
                        <option value="-1">eigenvalue</option>
                        <option value="-2">eigenvector</option>
                        <option value="-3">eigenbasis</option>
                        <option value="-4">set basis: m2</option>
                    </select>
                    <input id="m1_row" placeholder="row"></input>
                    <input id="m1_column" placeholder="col"></input>
                    <input id="m1_power" placeholder="pow"></input>
                </div>
            </div>

            <div id="operation_box" style="display: flex; align-items: center; margin: 0 1vw; margin-top: -8vh;">
                <select id="operation" class="button unblur" style="padding: 1vh; font-size: 1.5vw;">
                    <option value="2">*</option>
                    <option value="0">+</option>
                    <option value="1">-</option>
                </select>
            </div>
            
            <div class="matrix-input-box">
                
                <div class="matrix-container" id="m2_box" style="margin-bottom: 3vh;">
                </div>
                
                <div style="display: flex;" class="reset-font-size">
                    <select id="m2_property" class="button unblur">
                        <option value="3">det</option>
                        <option value="4">inverse</option>
                        <option value="5">transpose</option>
                        <option value="6">adjoint</option>
                        <option value="7">minor</option>
                        <option value="8">cofactor</option>
                        <option value="9">raise power</option>
                        <option value="-1">eigenvalue</option>
                        <option value="-2">eigenvector</option>
                        <option value="-3">eigenbasis</option>
                        <option value="-5">set basis: m1</option>
                    </select>
                    <input id="m2_row" placeholder="row"></input>
                    <input id="m2_column" placeholder="col"></input>
                    <input id="m2_power" placeholder="pow"></input>
                </div>
            </div>

            </div><br><br>
            
            <div>
            <input type="button" id="randomise" value="Randomise" class="button button3" style="margin-top: 30px;">
            <input type="button" id="clear" value="Clear" class="button button3">
            <!-- <input type="button" id="submit" value="Submit" class="button button3"> -->
            </div>
            
            <div style="margin: 0 auto; text-align: center;">
                <h2 style="padding-top: 20px;">Output</h2>
                <p id="output" style="text-align: left; justify-content: center; display: grid; padding-top: 0;"></p>
            </div>
        </form>
        
        <script src="../build/calculator.js" type="module"></script>
        
    </body>
</section>
</html>
