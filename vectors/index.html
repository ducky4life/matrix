<!DOCTYPE html>

<html>
<body>
<head>
    <title>matrix calculator</title>
    <link rel="stylesheet" href="../build/style.css" />
    <link rel="icon" type="image/x-icon" href="../build/favicon.ico">
    <link rel="preload" href="https://fonts.googleapis.com" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com" rel="stylesheet"></noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

</head>
    <script>
        var exports = {};
    </script>
    <div class="navBar">
        <nav><a href="/" class="navText">Ducky</a></nav>
        <nav style="margin-left: auto; display: flex; margin-right: 1vw;"><h2><a href="..">generator</a></h2></nav>
        <nav style="display: flex; margin-right: 1vw;"><h2><a href="../game">exercise</a></h2></nav>
        <nav style="display: flex; margin-right: 1vw;"><h2><a href="../calculator">calculator</a></h2></nav>
        <nav style="display: flex; margin-right: 1vw;"><h2><a href="../systems">systems</a></h2></nav>
        <nav style="display: flex; margin-right: 4vw;"><h2>vectors</h2></nav>
    </div>
    
    <section class="wrapper">
        <div class="bg-fixed" aria-hidden="true"></div>
        <form style="width: 100vw;" class="matrix-form">
            <h2>Vector operation calculator</h2><br>
            <a class="codebadges" href="https://github.com/ducky4life/matrix"><img src="https://img.shields.io/badge/Source Code-181717?logo=github&logoColor=fff&style=for-the-badge" alt="GitHub Badge"></a>
            <p style="padding-top: 10px;">under construction</p>
            <div id="score-div"><p style="padding-top: 10px; padding-bottom: 0;">score:</p><p id="score" style="padding: 0;">0</p></div>

            <div style="padding-bottom: 10vh;" class="textboxes">
            <div>
                <p for="toggle_mode">mode:</p><br>
                <select id="toggle_mode" class="button" style="height: auto;">
                    <option value="calculator">calculator</option>
                    <option value="game">exercise</option>
                </select>
            </div>

            <div id="exercise_type_box" style="padding-left: 30px;">
                <p for="type">type:</p><br>
                <select id="type" class="button button3">
                    <option value="0">addition</option>
                    <option value="1">subtraction</option>
                    <option value="2">dot product</option>
                    <option value="3">cross product</option>
                    <option value="4">magnitude</option>
                    <option value="5">unit vector</option>
                    <option value="6">included angle</option>
                    <option value="7">projection vector</option>
                    <option value="8">projection magnitude</option>
                    <option value="9">volume of tetrahedron</option>
                    <option value="10">included angle with plane</option>
                    <option value="11">coplanar</option>
                    <option value="12">vector from projection</option>
                    <option value="13">position vector of proj.</option>
                    <option value="-1">random (basic arithmetic)</option>
                    <option value="-2">random (vector operators)</option>
                    <option value="-3">random (plane operators)</option>
                    <option value="-4">random (all)</option>
                </select>
            </div>

            <div class="small-textbox" style="margin-right: 0; width: 18vw; padding-left: 30px;" id="max_element_box">
                <p for="max_element">max element number:</p><br>
                <textarea id="max_element" style="width: 17vw;"></textarea>
            </div>

            <div class="toggles" style="flex-direction: column; align-items: flex-start;" id="toggles-box">
                <div class="toggles" style="padding-left: 30px; width: stretch; padding-top: 20px;">
                    <p class="toggles-padding-right">use basis vectors format</p>
                    <label class="switch">
                        <input type="checkbox" id="use_basis_format">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="toggles" style="padding-left: 30px; padding-top: 10px; width: stretch;" id="plane-toggle">
                    <p class="toggles-padding-right">input vectors as plane</p>
                    <label class="switch">
                        <input type="checkbox" id="use_as_plane">
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>
            </div>
            
            <div class="calculator-input-box" style="display: flex;">

            <div class="matrix-output gone" id="exercise" style="margin-left: 0; margin-bottom: 0;">
            </div>
                
            <div class="matrix-input-box" style="justify-content: center; flex-direction: row; max-width: 90vw;" id="matrix-input-box">
                <div style="display: flex; flex-direction: column; align-items: center;">
                <div id="m1_box"></div>
                <div style="transform: scale(0.5); display: flex;">
                    <select id="m1_property" class="button unblur">
                        <option value="4">magnitude</option>
                        <option value="5">unit vector</option>
                        <option value="6">inc. angle w/ v2</option>
                        <option value="7">projection vector on v2</option>
                        <option value="8">projection magnitude on v2</option>
                        <option value="9">get vector to v2</option>
                    </select>
                </div>
                </div>
                <div style="transform: scale(0.5);" id="operation_box">
                    <select id="operation" class="button unblur" style="padding: 1vh;">
                        <option value="0">+</option>
                        <option value="1">-</option>
                        <option value="2">•</option>
                        <option value="3">×</option>
                    </select>
                </div>
                <div style="display: flex; flex-direction: column; align-items: center;">
                <div id="m2_box"></div>
                <div style="transform: scale(0.5); display: flex;">
                    <select id="m2_property" class="button unblur">
                        <option value="4">magnitude</option>
                        <option value="5">unit vector</option>
                        <option value="6">inc. angle w/ v1</option>
                        <option value="7">projection vector on v1</option>
                        <option value="8">projection magnitude on v1</option>
                        <option value="9">get vector to v1</option>
                    </select>
                </div>
                </div>
                <div style="display: flex; align-items: center;"><input id="m1_number" class="vector-basis gone"></input></div>
            </div>

            </div><br><br><br><br>

            <div id="plane-vector-input" style="align-items: center;">
                <div style="display: flex; height: min-content;">
                    <select id="plane_property" class="button unblur">
                        <option value="-1">normal vector to plane</option>
                        <option value="-2">v1: inc. angle with plane</option>
                        <option value="-3">v1: coplanar with p1, p2</option>
                        <option value="-4">normal vector from proj. to v1</option>
                        <option value="-5">position vector to v1 projection</option>
                        <option value="-6">volume of tetrahedron with v1, v2</option>
                    </select>
                </div>
                <p style="padding-left: 20px; padding-top: 0;">p1:</p>
                <div id="p1_box" style="padding-left: 10px;"></div>
                <p style="padding-left: 20px; padding-top: 0;">p2:</p>
                <div id="p2_box" style="padding-left: 10px;"></div>
            </div>
            
            <div>
            <input type="button" id="randomise" value="Randomise" class="button button3" style="margin-top: 30px;">
                
            <input type="button" id="generate" value="Generate new exercise" class="button button3 gone" style="margin-top: 30px;">
            <input type="button" id="submit" value="Submit" class="button button3 gone">
            
            <input type="button" id="clear" value="Clear" class="button button3">
            </div>
            
            <div style="margin: 0 auto; text-align: center;" id="output-div">
                <h2 style="padding-top: 20px;">Output</h2>
                <p id="output" style="text-align: left; justify-content: center; justify-items: center; display: grid; padding-top: 0;"></p>
            </div>
        </form>
        
        <script src="../build/vector_switch.js" type="module"></script>
        
    </body>
</section>
</html>
